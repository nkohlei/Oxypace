# Netlify Configuration — Blog (Next.js static) + Oxypace Portal SPA
# oxypace.com.tr/          → Blog (Next.js static export)
# oxypace.com.tr/portal/*  → Oxypace Portal SPA (Vite)
# oxypace.com.tr/api/*     → Koyeb Express backend

[build]
  # Build command calls root package.json build (which builds client, blog and merges)
  command = "npm run build"
  # Output directory — merge-blog.js puts merged output in client/dist
  publish = "client/dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

# ── Edge Functions ───────────────────────────────
[[edge_functions]]
  path = "/*"
  function = "access-control"

# ── Domain redirect ──────────────────────────────
[[redirects]]
  from = "https://oxypace.netlify.app/*"
  to = "https://oxypace.com.tr/:splat"
  status = 301
  force = true

# ── API Proxy → Koyeb ────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "https://unlikely-rosamond-oxypace-e695aebb.koyeb.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/r2-media/*"
  to = "https://pub-094a78010abf4ebf9726834268946cb8.r2.dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://unlikely-rosamond-oxypace-e695aebb.koyeb.app/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://unlikely-rosamond-oxypace-e695aebb.koyeb.app/sitemap.xml"
  status = 200
  force = true

# ── OG Bot Proxy (Bot preview için) ──────────────
[[redirects]]
  from = "/portal/post/*"
  to = "https://unlikely-rosamond-oxypace-e695aebb.koyeb.app/og/post/:splat"
  status = 200
  force = true
  conditions = {Role = ["bot"]}

[[redirects]]
  from = "/portal/profile/*"
  to = "https://unlikely-rosamond-oxypace-e695aebb.koyeb.app/og/profile/:splat"
  status = 200
  force = true
  conditions = {Role = ["bot"]}

[[redirects]]
  from = "/portal/portal/*"
  to = "https://unlikely-rosamond-oxypace-e695aebb.koyeb.app/og/portal/:splat"
  status = 200
  force = true
  conditions = {Role = ["bot"]}

# ── Assets Fallback ──────────────────────────────
[[redirects]]
  from = "/assets/*"
  to = "/portal/assets/:splat"
  status = 200
  force = false

# ── Portal SPA Fallback ───────────────────────────
# /portal/* altındaki tüm route'lar → portal/index.html (SPA fallback)
[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200
  force = false

# ── Blog Fallback (Next.js static) ───────────────
# Kök domain'de static dosya bulunamazsa → Next.js 404 veya index
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

# ── Security Headers ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "off"

# ── Cache Control for Static Assets ──────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portal/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
