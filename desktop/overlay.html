<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Oxypace Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
    }

    /* ======== COLLAPSED (mini icon) mode ======== */
    #mini-btn {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 20px rgba(99,102,241,0.55);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #mini-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 6px 28px rgba(99,102,241,0.80);
    }
    #mini-btn .mini-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #f23f43;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      padding: 0 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #0a0e1a;
    }
    #mini-btn svg { pointer-events: none; }

    /* ======== MAIN PANEL ======== */
    #panel {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Header / drag bar */
    #header {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(15, 20, 40, 0.88);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 6px 8px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      -webkit-app-region: drag;
      cursor: grab;
    }
    #header .ox-logo {
      width: 18px; height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg,#6366f1,#818cf8);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; color: #fff;
      -webkit-app-region: no-drag;
    }
    #header .ch-name {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.88);
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      -webkit-app-region: no-drag;
    }
    /* Header action buttons — must be no-drag so they're clickable */
    .hbtn {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.08);
      border: none; border-radius: 5px;
      width: 22px; height: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.65);
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .hbtn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .hbtn.danger:hover { background: rgba(242,63,67,0.75); color: #fff; }
    .hbtn svg { width: 11px; height: 11px; }

    /* Participants list */
    #list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      padding-right: 2px;
    }
    #list::-webkit-scrollbar { width: 3px; }
    #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* Single participant card */
    .pcard {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(12, 17, 34, 0.80);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .pcard.speaking {
      background: rgba(35,165,90,0.16);
      border-color: rgba(35,165,90,0.38);
    }

    /* Avatar */
    .av-wrap {
      position: relative;
      width: 34px; height: 34px;
      flex-shrink: 0;
    }
    .av-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.10);
      background: #1e293b;
    }
    .speaking .av-img { border-color: #23a55a; box-shadow: 0 0 10px rgba(35,165,90,0.7); }

    /* Speaking pulse ring */
    .spk-ring {
      display: none;
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2px solid #23a55a;
      animation: pring 1s ease-out infinite;
    }
    .speaking .spk-ring { display: block; }
    @keyframes pring {
      0%   { transform: scale(1); opacity: 0.9; }
      80%  { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    /* Mute badge */
    .mute-badge {
      display: none;
      position: absolute; bottom: -2px; right: -2px;
      background: #f23f43;
      border: 1.5px solid #0a0e1a;
      border-radius: 50%;
      width: 14px; height: 14px;
      align-items: center; justify-content: center;
    }
    .muted .mute-badge { display: flex; }
    .mute-badge svg { width: 8px; height: 8px; fill: white; }

    /* Name + status */
    .pinfo { flex: 1; min-width: 0; }
    .pname {
      font-size: 12px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .pstatus { font-size: 10px; color: rgba(255,255,255,0.42); }
    .speaking .pstatus { color: #57f287; }

    /* Camera icon */
    .cam-icon { flex-shrink: 0; color: rgba(255,255,255,0.22); }
    .camOn .cam-icon { color: #57f287; }

    /* Empty */
    #empty {
      display: none;
      text-align: center;
      padding: 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      background: rgba(12,17,34,0.72);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>

<!-- Mini (collapsed) button -->
<div id="mini-btn" title="Overlay'i göster">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
  <div class="mini-count" id="mini-count">0</div>
</div>

<!-- Main panel -->
<div id="panel">
  <div id="header">
    <div class="ox-logo">O</div>
    <span class="ch-name" id="ch-name">Ses Odası</span>
    <span style="font-size:10px;color:rgba(255,255,255,0.40);-webkit-app-region:no-drag" id="p-count">0</span>

    <!-- Open App button -->
    <button class="hbtn" id="btn-open" title="Oxypace'i Aç">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </button>

    <!-- Collapse button -->
    <button class="hbtn" id="btn-collapse" title="Küçült">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
  </div>

  <div id="list"></div>
  <div id="empty">Katılımcı bekleniyor...</div>
</div>

<script>
  const { ipcRenderer } = require('electron');

  const panel    = document.getElementById('panel');
  const miniBtn  = document.getElementById('mini-btn');
  const miniCnt  = document.getElementById('mini-count');
  const listEl   = document.getElementById('list');
  const countEl  = document.getElementById('p-count');
  const emptyEl  = document.getElementById('empty');
  const chNameEl = document.getElementById('ch-name');
  const btnOpen  = document.getElementById('btn-open');
  const btnCol   = document.getElementById('btn-collapse');

  let collapsed = false;

  // ---- Open main window ----
  btnOpen.addEventListener('click', () => {
    ipcRenderer.send('overlay-focus-main');
  });

  // ---- Collapse / expand ----
  function setCollapsed(val) {
    collapsed = val;
    if (collapsed) {
      panel.style.display = 'none';
      miniBtn.style.display = 'flex';
    } else {
      panel.style.display = 'flex';
      miniBtn.style.display = 'none';
    }
  }

  btnCol.addEventListener('click', () => setCollapsed(true));
  miniBtn.addEventListener('click', () => setCollapsed(false));

  // ---- Avatar URL resolver ----
  const BASE = 'https://oxypace.com.tr';
  function resolveAvatar(avatar, name) {
    const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(name||'?')}&background=1e293b&color=fff&size=80&bold=true&format=png`;
    if (!avatar || avatar === 'null' || avatar === 'undefined' || avatar === '') return fallback;
    if (avatar.startsWith('http://') || avatar.startsWith('https://')) return avatar;
    // Relative path from backend
    const clean = avatar.startsWith('/') ? avatar : '/' + avatar;
    return BASE + clean;
  }

  // ---- Render ----
  function render(participants) {
    listEl.innerHTML = '';

    if (!participants || participants.length === 0) {
      emptyEl.style.display = 'block';
      countEl.textContent = '0';
      miniCnt.textContent = '0';
      return;
    }

    emptyEl.style.display = 'none';
    countEl.textContent = participants.length;
    miniCnt.textContent = participants.length;

    // Sort: speaking first, then camera-on
    const sorted = [...participants].sort((a, b) => {
      if (a.isSpeaking && !b.isSpeaking) return -1;
      if (!a.isSpeaking && b.isSpeaking) return 1;
      if (a.isCameraOn && !b.isCameraOn) return -1;
      if (!a.isCameraOn && b.isCameraOn) return 1;
      return 0;
    });

    sorted.forEach(p => {
      const classes = ['pcard',
        p.isSpeaking ? 'speaking' : '',
        p.isMuted ? 'muted' : '',
        p.isCameraOn ? 'camOn' : ''
      ].filter(Boolean).join(' ');

      const avatarUrl = resolveAvatar(p.avatar, p.name);
      const statusTxt = p.isSpeaking ? 'Konuşuyor...' : p.isMuted ? 'Sessiz' : 'Dinliyor';
      const fallbackUrl = resolveAvatar('', p.name);

      const camSvg = p.isCameraOn
        ? `<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>`
        : `<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/>`;

      const card = document.createElement('div');
      card.className = classes;
      card.innerHTML = `
        <div class="av-wrap">
          <img class="av-img" src="${avatarUrl}" alt="${p.name}"
            onerror="this.onerror=null;this.src='${fallbackUrl}'" />
          <div class="spk-ring"></div>
          <div class="mute-badge">
            <svg viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 1-7 7m0 0a7 7 0 0 1-7-7m7 7v4m0 0H8m4 0h4M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </div>
        </div>
        <div class="pinfo">
          <div class="pname">${p.name || 'Kullanıcı'}</div>
          <div class="pstatus">${statusTxt}</div>
        </div>
        <div class="cam-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${camSvg}</svg>
        </div>`;
      listEl.appendChild(card);
    });
  }

  // ---- IPC: receive data ----
  ipcRenderer.on('overlay-participants-update', (event, data) => {
    render(data.participants);
    if (data.channelName) chNameEl.textContent = data.channelName;
  });

  // ---- Smart click-through toggle ----
  // When mouse enters any visible UI element → enable mouse interaction
  // When mouse leaves → pass clicks through to the game below
  let interactiveTimeout = null;

  function setInteractive(on) {
    clearTimeout(interactiveTimeout);
    if (!on) {
      // Small delay before going click-through to avoid flicker on fast moves
      interactiveTimeout = setTimeout(() => {
        ipcRenderer.send('overlay-set-interactive', false);
      }, 150);
    } else {
      ipcRenderer.send('overlay-set-interactive', true);
    }
  }

  panel.addEventListener('mouseenter', () => setInteractive(true));
  panel.addEventListener('mouseleave', () => setInteractive(false));
  miniBtn.addEventListener('mouseenter', () => setInteractive(true));
  miniBtn.addEventListener('mouseleave', () => setInteractive(false));

  render([]);
</script>
</body>
</html>
