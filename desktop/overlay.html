<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Oxypace Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw; height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
    }

    /* ===== MINI (collapsed) ICON ===== */
    #mini-icon {
      display: none;
      position: fixed;
      top: 10px; right: 10px;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2, #7289da);
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 4px 24px rgba(88,101,242,0.7);
      cursor: pointer;
      align-items: center; justify-content: center;
      transition: transform 0.18s, box-shadow 0.18s;
      z-index: 9999;
      -webkit-app-region: drag;
    }
    #mini-icon:hover { transform: scale(1.15); box-shadow: 0 6px 32px rgba(88,101,242,0.9); }
    #mini-icon .mi-badge {
      position: absolute; top: -5px; right: -5px;
      background: #f23f43; color: #fff;
      font-size: 9px; font-weight: 800;
      min-width: 18px; height: 18px;
      border-radius: 9px; padding: 0 4px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #0a0e1a;
    }

    /* ===== MAIN PANEL ===== */
    #panel {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      gap: 6px;
      padding: 8px;
    }

    /* Header — draggable */
    #hdr {
      display: flex; align-items: center; gap: 8px;
      background: rgba(20,24,48,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 10px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      -webkit-app-region: drag;
      cursor: grab;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    #hdr:active { cursor: grabbing; }
    .ox-dot { width:8px;height:8px;border-radius:50%;background:#5865f2;flex-shrink:0;-webkit-app-region:no-drag; }
    #ch-name {
      flex:1; font-size:12px; font-weight:700; color:#fff;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      text-shadow:0 1px 4px rgba(0,0,0,0.8);
      -webkit-app-region:no-drag;
    }
    .hbtn {
      -webkit-app-region:no-drag;
      background:rgba(255,255,255,0.08); border:none; border-radius:5px;
      width:24px;height:24px; cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      color:rgba(255,255,255,0.65);
      transition:background 0.15s,color 0.15s; flex-shrink:0;
    }
    .hbtn:hover { background:rgba(255,255,255,0.18); color:#fff; }
    .hbtn svg { width:13px;height:13px; }

    /* ===== PARTICIPANTS GRID ===== */
    #grid {
      display: grid;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-right: 2px;
    }
    #grid::-webkit-scrollbar { width: 3px; }
    #grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    .pcard {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(15,18,36,0.92);
      border: 1.5px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      min-height: 100px;
    }
    .pcard.speaking { border-color: #23a55a; box-shadow: 0 0 0 2px rgba(35,165,90,0.55); }

    /* Video thumbnail or avatar */
    .pcam {
      width:100%;height:100%;object-fit:cover;
      border-radius:7px;
    }
    .pav {
      width:52px;height:52px;border-radius:50%;object-fit:cover;
      border:2px solid rgba(255,255,255,0.15);
      background:#1e293b;
    }

    /* Speaking ring around avatar */
    .spk-ring {
      display:none;
      position:absolute;inset:-4px;border-radius:50%;
      border:2px solid #23a55a;
      animation:pring 1s ease-out infinite;
      pointer-events:none;
    }
    .spk-ring-wrap { position:relative; display:inline-flex; align-items:center; justify-content:center; }
    .speaking .spk-ring { display:block; }
    @keyframes pring { 0%{transform:scale(1);opacity:.9} 80%,100%{transform:scale(1.4);opacity:0} }

    /* Name bar at bottom of card */
    .pname-bar {
      position:absolute;bottom:0;left:0;right:0;
      padding:4px 8px;
      background:linear-gradient(transparent,rgba(0,0,0,0.85));
      display:flex;align-items:center;gap:4px;
      z-index: 10;
    }
    .pname-txt { font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1; }
    .pbadge { flex-shrink:0; display:flex;align-items:center; }
    .pbadge svg { width:11px;height:11px; }
    .mute-col { color:#f23f43; }
    .spk-dot { width:6px;height:6px;border-radius:50%;background:#23a55a;animation:spkpulse 0.8s infinite; }
    @keyframes spkpulse{0%,100%{opacity:1}50%{opacity:0.4}}

    /* ===== CONTROLS BAR ===== */
    #controls {
      display:flex; align-items:center; justify-content:space-between;
      background: rgba(20,24,48,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .cbtn {
      display:flex;flex-direction:column;align-items:center;gap:3px;
      cursor:pointer;border:none;background:transparent;
      padding:4px;border-radius:6px;
      transition:background 0.15s;color:#fff;
    }
    .cbtn:hover { background:rgba(255,255,255,0.10); }
    .cbtn.active { color:#23a55a; }
    .cbtn.active .ci { background:rgba(35,165,90,0.18);border-color:rgba(35,165,90,0.5); }
    .cbtn.inactive { color:rgba(255,255,255,0.4); }
    .cbtn.inactive .ci { background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1); }
    .cbtn.danger { color:#f23f43; }
    .cbtn.danger .ci { background:rgba(242,63,67,0.18);border-color:rgba(242,63,67,0.5); }
    .ci {
      width:36px;height:36px;border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.07);
      transition:background 0.15s,border-color 0.15s;
    }
    .ci svg { width:18px;height:18px; }
    .clabel { font-size:9px;font-weight:600;color:inherit;opacity:0.85; }
    .divider { width:1px;height:32px;background:rgba(255,255,255,0.08); }

    /* Empty state */
    #empty {
      display:none;text-align:center;padding:12px;
      font-size:11px;color:rgba(255,255,255,0.35);
      background:rgba(20,24,48,0.80);border-radius:8px;
      border:1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>

<!-- Collapsed mini icon (visible when panel is hidden) -->
<div id="mini-icon" title="Overlay'i göster">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
  <div class="mi-badge" id="mi-badge">0</div>
</div>

<!-- Main overlay panel -->
<div id="panel">
  <!-- Header -->
  <div id="hdr">
    <div class="ox-dot"></div>
    <span id="ch-name">Ses Odası</span>
    <span id="p-count" style="font-size:10px;color:rgba(255,255,255,0.4);-webkit-app-region:no-drag"></span>

    <!-- Open main app -->
    <button class="hbtn" id="btn-open" title="Oxypace'i Aç">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </button>

    <!-- Collapse -->
    <button class="hbtn" id="btn-collapse" title="Gizle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
  </div>

  <!-- Participants grid -->
  <div id="grid"></div>
  <div id="empty">Katılımcı bekleniyor...</div>

  <!-- Controls -->
  <div id="controls">
    <button class="cbtn inactive" id="btn-mic" title="Mikrofon">
      <div class="ci" id="mic-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <span class="clabel">Sessiz</span>
    </button>

    <button class="cbtn inactive" id="btn-cam" title="Kamera">
      <div class="ci" id="cam-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path id="cam-svg-path" d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/>
          <line id="cam-svg-x" x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </div>
      <span class="clabel">Kamera</span>
    </button>

    <button class="cbtn inactive" id="btn-screen" title="Ekran Paylaşımı">
      <div class="ci">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <span class="clabel">Ekran</span>
    </button>

    <div class="divider"></div>

    <button class="cbtn danger" id="btn-leave" title="Ayrıl">
      <div class="ci">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07C9.44 16.29 7.71 14.56 6.47 12.43A19.79 19.79 0 0 1 3.4 3.72 2 2 0 0 1 5.41 1.5h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.39 9.41"/>
          <line x1="23" y1="1" x2="1" y2="23"/>
        </svg>
      </div>
      <span class="clabel">Ayrıl</span>
    </button>
  </div>
</div>

<script>
  // Destructure from exposed window.desktopAPI securely
  const { 
    sendOverlayControl, 
    onOverlayControlAction, 
    updateOverlayParticipants 
  } = window.desktopAPI;

  const panel    = document.getElementById('panel');
  const miniIcon = document.getElementById('mini-icon');
  const miBadge  = document.getElementById('mi-badge');
  const grid     = document.getElementById('grid');
  const empty    = document.getElementById('empty');
  const chName   = document.getElementById('ch-name');
  const pCount   = document.getElementById('p-count');
  const btnOpen  = document.getElementById('btn-open');
  const btnCol   = document.getElementById('btn-collapse');
  const btnMic   = document.getElementById('btn-mic');
  const btnCam   = document.getElementById('btn-cam');
  const btnScr   = document.getElementById('btn-screen');
  const btnLeave = document.getElementById('btn-leave');

  let collapsed = false;
  let localState = { isMuted: true, isCameraOn: false, isScreenSharing: false };
  let lastParticipants = [];

  // ===== COLLAPSE / EXPAND =====
  function setCollapsed(val) {
    collapsed = val;
    panel.style.display = val ? 'none' : 'flex';
    miniIcon.style.display = val ? 'flex' : 'none';
  }
  btnCol.addEventListener('click', () => setCollapsed(true));
  miniIcon.addEventListener('click', () => setCollapsed(false));

  // ===== IPC CONTROLS (Using preload bridge) =====
  btnOpen.addEventListener('click', () => {
    window.desktopAPI.openExternal('oxypace://'); // fallback deep link launch
    sendOverlayControl('focus-main');
  });
  btnMic.addEventListener('click', () => sendOverlayControl('toggle-mic'));
  btnCam.addEventListener('click', () => sendOverlayControl('toggle-camera'));
  btnScr.addEventListener('click', () => sendOverlayControl('toggle-screen'));
  btnLeave.addEventListener('click', () => sendOverlayControl('leave'));

  // ===== UPDATE CONTROLS STATE =====
  function updateControlsUI(ls) {
    if (!ls.isMuted) {
      btnMic.className = 'cbtn active';
      btnMic.querySelector('.clabel').textContent = 'Mikrofon';
    } else {
      btnMic.className = 'cbtn inactive';
      btnMic.querySelector('.clabel').textContent = 'Sessiz';
    }

    const camSvg = btnCam.querySelector('svg');
    if (ls.isCameraOn) {
      btnCam.className = 'cbtn active';
      btnCam.querySelector('.clabel').textContent = 'Kamera';
      camSvg.innerHTML = `<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>`;
    } else {
      btnCam.className = 'cbtn inactive';
      btnCam.querySelector('.clabel').textContent = 'Kamera';
      camSvg.innerHTML = `<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    }

    if (ls.isScreenSharing) {
      btnScr.className = 'cbtn active';
    } else {
      btnScr.className = 'cbtn inactive';
    }
  }

  // ===== AVATAR URL =====
  const BASE = 'https://oxypace.com.tr';
  function resolveAvatar(avatar, name) {
    const fb = `https://ui-avatars.com/api/?name=${encodeURIComponent(name||'?')}&background=2d3561&color=fff&size=120&bold=true&format=png`;
    if (!avatar || ['null','undefined',''].includes(String(avatar))) return fb;
    if (avatar.startsWith('http')) return avatar;
    return BASE + (avatar.startsWith('/') ? avatar : '/' + avatar);
  }

  // ===== RENDER PARTICIPANTS =====
  function render(participants, ls) {
    grid.innerHTML = '';
    miBadge.textContent = participants.length;
    pCount.textContent = participants.length ? `${participants.length} kişi` : '';

    if (!participants.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    // Dynamic grid: 1 person=1col, 2-4=2col, 5+=3col
    const cols = participants.length === 1 ? 1 : participants.length <= 4 ? 2 : 3;
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    // Sort: speaking > camera on > rest
    const sorted = [...participants].sort((a, b) => {
      if (a.isSpeaking && !b.isSpeaking) return -1;
      if (!a.isSpeaking && b.isSpeaking) return 1;
      if (a.isCameraOn && !b.isCameraOn) return -1;
      if (!a.isCameraOn && b.isCameraOn) return 1;
      return 0;
    });

    sorted.forEach(p => {
      const card = document.createElement('div');
      card.className = 'pcard' + (p.isSpeaking ? ' speaking' : '');
      card.setAttribute('data-identity', p.identity);

      const avatarUrl = resolveAvatar(p.avatar, p.name);
      const fallback  = resolveAvatar('', p.name);

      let mediaHTML = '';
      if (p.videoFrame) {
        mediaHTML = `<img class="pcam" src="${p.videoFrame}" alt="${p.name}" />`;
      } else {
        mediaHTML = `
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
            <div class="spk-ring-wrap">
              <img class="pav" src="${avatarUrl}" onerror="this.src='${fallback}'" />
              ${p.isSpeaking ? '<div class="spk-ring"></div>' : ''}
            </div>
          </div>`;
      }

      const muteBadge = p.isMuted
        ? `<span class="pbadge mute-col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>`
        : '';
      const spkBadge = p.isSpeaking ? `<span class="pbadge"><div class="spk-dot"></div></span>` : '';

      card.innerHTML = `
        ${mediaHTML}
        <div class="pname-bar">
          <span class="pname-txt">${p.name || 'Kullanıcı'}</span>
          ${muteBadge}${spkBadge}
        </div>`;

      grid.appendChild(card);
    });
  }

  // ===== IPC: receive data =====
  window.desktopAPI.onOverlayControlAction((payload) => {
    // If we receive participant data updates
    if (payload.participants) {
      lastParticipants = payload.participants;
      if (payload.channelName) chName.textContent = payload.channelName;
      if (payload.localState) {
        localState = payload.localState;
        updateControlsUI(localState);
      }
      render(lastParticipants, localState);
    }
  });

  // Keep compatibility with the older custom listener name
  const { ipcRenderer } = require('electron');
  ipcRenderer.on('overlay-participants-update', (event, data) => {
    lastParticipants = data.participants || [];
    if (data.channelName) chName.textContent = data.channelName;
    if (data.localState) {
      localState = data.localState;
      updateControlsUI(localState);
    }
    render(lastParticipants, localState);
  });

  ipcRenderer.on('overlay-video-frame', (event, { identity, frame }) => {
    const card = grid.querySelector(`[data-identity="${identity}"]`);
    if (card) {
      const existing = card.querySelector('.pcam');
      if (existing) {
        existing.src = frame;
      } else {
        const wrap = card.querySelector('div');
        if (wrap) {
          card.innerHTML = `<img class="pcam" src="${frame}" alt="" />${card.querySelector('.pname-bar')?.outerHTML || ''}`;
        }
      }
    }
  });

  updateControlsUI(localState);
  render([], localState);
</script>
</body>
</html>
