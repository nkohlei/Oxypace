<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxypace Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 15, 20, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .status-sub {
      font-size: 13px;
      color: #94a3b8;
      max-width: 80%;
      line-height: 1.4;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 16px 24px;
      border-radius: 12px;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="player-container">
    <div id="overlay" class="overlay">
      <div class="spinner" id="spinner"></div>
      <div class="status-title" id="status-title">Film Akışı Çözülüyor...</div>
      <div class="status-sub" id="status-sub">Lütfen bekleyin, video hazırlanıyor.</div>
    </div>
    <video id="video" controls playsinline crossorigin="anonymous"></video>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const filmUrl = params.get('url');

      const overlay = document.getElementById('overlay');
      const spinner = document.getElementById('spinner');
      const statusTitle = document.getElementById('status-title');
      const statusSub = document.getElementById('status-sub');
      const video = document.getElementById('video');

      if (!filmUrl) {
        spinner.style.display = 'none';
        statusTitle.textContent = 'Film Bağlantısı Eksik';
        statusSub.textContent = 'Lütfen iFrame URL parametresine geçerli bir film linki ekleyin. (Örn: ?url=https://...)';
        return;
      }

      try {
        // API isteği at
        const res = await fetch('/api/resolve-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: filmUrl })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Akış adresi çözülemedi.');
        }

        const { streamUrl, headers, type } = data;
        const proxyUrl = `/api/proxy?url=${encodeURIComponent(streamUrl)}&referer=${encodeURIComponent(headers?.referer || '')}`;

        // Overlay kaldır
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);

        // HLS Oynat
        if (type === 'm3u8' && Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
          });
          hls.loadSource(proxyUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
          });
        } else {
          video.src = proxyUrl;
          video.play().catch(() => {});
        }
      } catch (err) {
        spinner.style.display = 'none';
        statusTitle.textContent = '❌ Video Yüklenemedi';
        statusSub.innerHTML = `<div class="error-box">${err.message || 'Film sunucusundan yayın alınamadı.'}</div>`;
      }
    })();
  </script>
</body>
</html>
